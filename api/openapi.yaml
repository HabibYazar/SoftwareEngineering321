openapi: 3.1.0
info:
  title: HMS Community API (Sprint 1 Draft)
  version: 0.1.0
  description: |
    Proposed academic contract aligned with Product Backlog V3.
    Week 8 MVP: login, roles/audit foundations, patient registration/search,
    clinician directory, appointments, outpatient examination and EMR.
    Week 10 final: laboratory requests, results and physician review.
    Implemented in the backend: GET /health, POST /auth/login, POST /auth/logout,
    POST /patients, GET /patients, GET /patients/{patientId} and
    PUT /patients/{patientId}. Operations whose persistence integration is still
    pending respond 503 (code INTEGRATION_PENDING) instead of fabricating data.
    All other operations remain planned. Synthetic test data only; not for clinical use.
    Staff roles: Administrator, Receptionist, Physician, Nurse,
    Patient Care Assistant, Lab Technician, Cleaning Staff.
    Authorization (US-02) is deny-by-default: missing/invalid/revoked token -> 401,
    authenticated role without permission -> 403 (code ACCESS_DENIED). Until the
    Product Owner approves the role-permission matrix, patient operations are
    granted only to Receptionist, as stated in US-06/US-07/US-08.
    User-story IDs and priorities are documented in the Product Backlog V3.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Authentication
  - name: Patients
  - name: Staff
  - name: Appointments
  - name: Outpatient
  - name: Records
  - name: Laboratory
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Scaffold health endpoint (implemented)
      security: []
      responses:
        '200':
          description: Process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: loginStaff
      summary: Staff login (US-01, implemented)
      description: |
        Validates the username/password against BCrypt hashes from the staff
        account store (#114). Wrong passwords and unknown usernames return the
        same 401 response (code INVALID_CREDENTIALS) and never issue a token.
        Responds 503 (INTEGRATION_PENDING) while the staff account store is not integrated.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Valid credentials, role and session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutStaff
      summary: Invalidate the current staff session/token (US-01, implemented)
      description: Revokes the bearer token used for this request server-side; any later request with it returns 401.
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /patients:
    get:
      tags: [Patients]
      operationId: searchPatients
      summary: Search synthetic patients by name or national ID (US-07, implemented; persistence pending #177)
      description: |
        Receptionist only. Supply exactly one of: an exact 11-digit synthetic
        national ID, or a name fragment matched case-insensitively (Turkish rules)
        anywhere in the first name, last name or "first last". Results are ordered
        by last name, first name. No match returns 200 with an empty array.
        Neither or both parameters return 400 (field searchCriteria). Each returned
        patient is recorded as an audit VIEW event (accessChannel SEARCH_RESULT).
      parameters:
        - in: query
          name: name
          schema: { type: string, minLength: 1, maxLength: 150 }
        - in: query
          name: nationalId
          schema: { type: string, pattern: '^[0-9]{11}$' }
      responses:
        '200':
          description: Matching patients, or an empty array if none
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Register a synthetic patient (US-06, implemented; persistence pending #177)
      description: |
        Receptionist only. All field errors are returned together in Problem.errors
        (code VALIDATION_FAILED); rejected values are never echoed back. A duplicate
        national ID returns 409 (code DUPLICATE_NATIONAL_ID). Successful registration
        is recorded as an audit CREATE event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPatient' }
      responses:
        '201':
          description: Patient created
          headers:
            Location:
              description: URL of the created patient
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /patients/{patientId}:
    get:
      tags: [Patients]
      operationId: getPatient
      summary: Retrieve a patient record (US-07/US-08, implemented; persistence pending #177)
      description: Receptionist only. Recorded as an audit VIEW event (accessChannel RECORD).
      parameters:
        - $ref: '#/components/parameters/patientId'
      responses:
        '200':
          description: Patient record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    put:
      tags: [Patients]
      operationId: updatePatient
      summary: Update patient information (US-08, implemented; persistence pending #177/#196)
      description: |
        Receptionist only. Full replacement of every field except the national ID;
        US-06 validation rules apply (including the ADVANCED relative requirement).
        Omitting relativeInformation removes it, which is only allowed for MILD/MODERATE.
        A nationalId that differs from the stored value returns 400 (field nationalId,
        code Immutable). A successful update is recorded as an audit UPDATE event with
        privacy-filtered before/after values of the changed fields.
      parameters:
        - $ref: '#/components/parameters/patientId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientUpdate' }
      responses:
        '200':
          description: Updated patient record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /staff:
    get:
      tags: [Staff]
      operationId: listClinicians
      summary: List clinicians available in synthetic demo (planned)
      parameters:
        - in: query
          name: department
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Matching clinicians
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Clinician' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /appointments:
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Book a clinician 15-minute slot (US-11, planned for MVP)
      description: |
        Only slots during seeded/assigned clinician working hours are permitted.
        A booking in the past or for an unregistered patient is rejected.
        Concurrent requests must not double-book the same doctor and slot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAppointment' }
            example:
              patientId: 1dc9c3dd-54fd-45c5-829e-5040a6a92913
              clinicianId: 4b04cc12-df95-4fb4-a6d4-fb9f3cd454da
              startsAt: '2026-11-04T10:00:00+03:00'
              endsAt: '2026-11-04T10:15:00+03:00'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Clinician time slot unavailable / appointment collision
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Appointment conflict
                status: 409
                code: SLOT_UNAVAILABLE
                detail: This time interval overlaps an active appointment.
    get:
      tags: [Appointments]
      operationId: listPhysicianAppointments
      summary: Physician daily schedule (US-14, planned for MVP)
      description: Physician may view only their own appointments, ordered by start time.
      parameters:
        - in: query
          name: clinicianId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Ordered appointments for the selected physician and date
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /appointments/{appointmentId}/cancel:
    post:
      tags: [Appointments]
      operationId: cancelAppointment
      summary: Cancel a scheduled appointment (US-12, planned for MVP)
      description: Cancelled slot becomes available; completed visits cannot be cancelled.
      parameters:
        - $ref: '#/components/parameters/appointmentId'
      responses:
        '200':
          description: Updated cancelled appointment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /encounters:
    post:
      tags: [Outpatient]
      operationId: startEncounter
      summary: Start outpatient encounter (planned)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewEncounter' }
      responses:
        '201':
          description: Encounter started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encounter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /encounters/{encounterId}:
    patch:
      tags: [Outpatient]
      operationId: completeEncounter
      summary: Complete an active examination (US-15, planned for MVP)
      description: Only the assigned physician may complete an IN_EXAMINATION encounter.
      parameters:
        - $ref: '#/components/parameters/encounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [COMPLETED] }
      responses:
        '200':
          description: Completed examination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encounter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /encounters/{encounterId}/clinical-note:
    put:
      tags: [Records]
      operationId: saveClinicalNote
      summary: Save complaint, findings and diagnosis (US-17.1, planned for MVP)
      description: Notes are editable during examination, but read-only after completion.
      parameters:
        - $ref: '#/components/parameters/encounterId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClinicalNote' }
      responses:
        '200':
          description: Saved or updated clinical note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClinicalNote' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Records]
      operationId: getClinicalNote
      summary: View examination note and diagnosis (US-17.1, planned)
      parameters:
        - $ref: '#/components/parameters/encounterId'
      responses:
        '200':
          description: Clinical note for this examination
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClinicalNote' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /patients/{patientId}/medical-history:
    get:
      tags: [Records]
      operationId: getMedicalHistory
      summary: View medical history and allergies (US-17.2, planned for MVP)
      parameters:
        - $ref: '#/components/parameters/patientId'
      responses:
        '200':
          description: Patient history and allergy warnings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalHistory' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Records]
      operationId: updateMedicalHistory
      summary: Record medical history and allergies (US-17.2, planned for MVP)
      parameters:
        - $ref: '#/components/parameters/patientId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicalHistory' }
      responses:
        '200':
          description: Saved medical history and allergies
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedicalHistory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lab-orders:
    post:
      tags: [Laboratory]
      operationId: createLabOrder
      summary: Physician requests a lab test (US-19, Week 10 final)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewLabOrder' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lab-orders/{orderId}/results:
    post:
      tags: [Laboratory]
      operationId: recordLabResult
      summary: Enter synthetic laboratory result (US-20, Week 10 final)
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewLabResult' }
      responses:
        '201':
          description: Result recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Laboratory]
      operationId: getLabResults
      summary: Physician reviews test result (US-21, Week 10 final)
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Lab result with reference-range warning (when available)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Opaque random token returned by POST /auth/login. Validated server-side,
        revoked by POST /auth/logout and expires at LoginResponse.expiresAt.
  parameters:
    patientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    orderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    appointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    encounterId:
      name: encounterId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Health:
      type: object
      required: [service, status]
      properties:
        service: { type: string, example: hms-community }
        status: { type: string, enum: [UP] }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, format: password, minLength: 1, maxLength: 128 }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, role, expiresAt]
      properties:
        accessToken: { type: string, description: 'Opaque bearer token; send as "Authorization: Bearer <token>"' }
        tokenType: { type: string, enum: [Bearer] }
        expiresAt: { type: string, format: date-time, description: Absolute expiry of the token }
        role:
          type: string
          enum: [Administrator, Receptionist, Physician, Nurse, PatientCareAssistant, LabTechnician, CleaningStaff]
    RelativeInformation:
      type: object
      required: [fullName, relationship, phone]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        relationship: { type: string, minLength: 1, maxLength: 80 }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
    PhoneNumber:
      type: string
      minLength: 7
      maxLength: 32
      pattern: '^\+?[0-9][0-9 ()-]{5,29}[0-9]$'
      description: Optional leading +, digits with spaces, parentheses or hyphens; starts and ends with a digit
      example: '+90 (555) 000-00-00'
    NewPatient:
      type: object
      description: |
        US-06: synthetic 11-digit national ID must be unique. Relative information
        is mandatory when conditionLevel is ADVANCED (field error code
        RequiredForAdvancedCondition) and optional otherwise; when provided, all
        three relative fields are required. Validation uses 400 for missing/invalid
        fields and 409 for duplicate national ID. Leading/trailing whitespace is trimmed.
      required: [firstName, lastName, nationalId, dateOfBirth, gender, phone, address, conditionLevel]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        nationalId: { type: string, pattern: '^[0-9]{11}$', description: Synthetic test ID only }
        dateOfBirth: { type: string, format: date, description: Must not be in the future }
        gender: { type: string, minLength: 1, maxLength: 40 }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        address: { type: string, minLength: 1, maxLength: 500 }
        conditionLevel: { type: string, enum: [MILD, MODERATE, ADVANCED] }
        relativeInformation: { $ref: '#/components/schemas/RelativeInformation' }
      allOf:
        - if:
            properties:
              conditionLevel: { const: ADVANCED }
            required: [conditionLevel]
          then:
            required: [relativeInformation]
    PatientUpdate:
      type: object
      description: |
        US-08: same fields and validation as NewPatient, but nationalId is optional
        and, if present, must equal the stored value (it can never be changed).
      required: [firstName, lastName, dateOfBirth, gender, phone, address, conditionLevel]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 100 }
        lastName: { type: string, minLength: 1, maxLength: 100 }
        nationalId: { type: string, pattern: '^[0-9]{11}$', description: Optional; must match the stored value }
        dateOfBirth: { type: string, format: date, description: Must not be in the future }
        gender: { type: string, minLength: 1, maxLength: 40 }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        address: { type: string, minLength: 1, maxLength: 500 }
        conditionLevel: { type: string, enum: [MILD, MODERATE, ADVANCED] }
        relativeInformation: { $ref: '#/components/schemas/RelativeInformation' }
      allOf:
        - if:
            properties:
              conditionLevel: { const: ADVANCED }
            required: [conditionLevel]
          then:
            required: [relativeInformation]
    Patient:
      allOf:
        - $ref: '#/components/schemas/NewPatient'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Clinician:
      type: object
      required: [id, displayName, department]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        department: { type: string }
    NewAppointment:
      type: object
      required: [patientId, clinicianId, startsAt, endsAt]
      properties:
        patientId: { type: string, format: uuid }
        clinicianId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time, description: Must be exactly 15 minutes after startsAt }
    Appointment:
      allOf:
        - $ref: '#/components/schemas/NewAppointment'
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [SCHEDULED, IN_EXAMINATION, CANCELLED, COMPLETED] }
    NewEncounter:
      type: object
      required: [appointmentId]
      properties:
        appointmentId: { type: string, format: uuid }
    Encounter:
      allOf:
        - $ref: '#/components/schemas/NewEncounter'
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [IN_EXAMINATION, COMPLETED] }
    ClinicalNote:
      type: object
      required: [complaint, findings, diagnosis]
      properties:
        complaint: { type: string, minLength: 1 }
        findings: { type: string, minLength: 1 }
        diagnosis: { type: string, minLength: 1, description: ICD-10 subset or free-text diagnosis }
    MedicalHistory:
      type: object
      properties:
        chronicConditions:
          type: array
          items: { type: string }
        previousIllnessesAndSurgeries:
          type: array
          items: { type: string }
        allergies:
          type: array
          items:
            type: object
            required: [type, substance]
            properties:
              type: { type: string, enum: [DRUG, FOOD, OTHER] }
              substance: { type: string }
              notes: { type: string }
    NewLabOrder:
      type: object
      required: [encounterId, testCode]
      properties:
        encounterId: { type: string, format: uuid }
        testCode: { type: string, maxLength: 50 }
    LabOrder:
      allOf:
        - $ref: '#/components/schemas/NewLabOrder'
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [REQUESTED, PROCESSING, COMPLETED, CANCELLED] }
    NewLabResult:
      type: object
      required: [resultValue, unit]
      properties:
        resultValue: { type: string, maxLength: 128 }
        unit: { type: string, maxLength: 32 }
        note: { type: string, maxLength: 500 }
    LabResult:
      allOf:
        - $ref: '#/components/schemas/NewLabResult'
        - type: object
          required: [id, recordedAt]
          properties:
            id: { type: string, format: uuid }
            recordedAt: { type: string, format: date-time }
            referenceRange: { type: string, description: Human-readable reference range for the chosen test }
            outOfRange: { type: boolean, description: Flag values outside the test reference range }
    Problem:
      type: object
      required: [title, status, code]
      properties:
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: string }
        errors:
          type: array
          description: Field-level validation errors (present when code is VALIDATION_FAILED)
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string, example: relativeInformation.phone }
              code: { type: string, example: NotBlank }
              message: { type: string }
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: User is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Requested state conflicts with existing data
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: Required persistence integration is pending (code INTEGRATION_PENDING)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
