openapi: 3.1.0
info:
  title: HMS Community API (Sprint 1 Draft)
  version: 0.1.0
  description: |
    Proposed academic contract. Only GET /health exists in the scaffold.
    All clinical operations below are unimplemented and use synthetic data only.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Patients
  - name: Staff
  - name: Appointments
  - name: Outpatient
  - name: Laboratory
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Scaffold health endpoint (implemented)
      security: []
      responses:
        '200':
          description: Process is responding
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /patients:
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Register a synthetic patient (planned)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPatient' }
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /patients/{patientId}:
    get:
      tags: [Patients]
      operationId: getPatient
      summary: Retrieve a patient record (planned)
      parameters:
        - $ref: '#/components/parameters/patientId'
      responses:
        '200':
          description: Patient record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /staff:
    get:
      tags: [Staff]
      operationId: listClinicians
      summary: List clinicians available in synthetic demo (planned)
      parameters:
        - in: query
          name: department
          required: false
          schema: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Matching clinicians
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Clinician' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /appointments:
    post:
      tags: [Appointments]
      operationId: createAppointment
      summary: Book a clinician time slot (planned)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewAppointment' }
            example:
              patientId: 1dc9c3dd-54fd-45c5-829e-5040a6a92913
              clinicianId: 4b04cc12-df95-4fb4-a6d4-fb9f3cd454da
              startsAt: '2026-11-04T10:00:00+03:00'
              endsAt: '2026-11-04T10:20:00+03:00'
      responses:
        '201':
          description: Appointment created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Clinician time slot unavailable / appointment collision
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
              example:
                title: Appointment conflict
                status: 409
                code: SLOT_UNAVAILABLE
                detail: This time interval overlaps an active appointment.
  /encounters:
    post:
      tags: [Outpatient]
      operationId: startEncounter
      summary: Start outpatient encounter (planned)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewEncounter' }
      responses:
        '201':
          description: Encounter started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Encounter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /lab-orders:
    post:
      tags: [Laboratory]
      operationId: createLabOrder
      summary: Physician requests a lab test (planned)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewLabOrder' }
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /lab-orders/{orderId}/results:
    post:
      tags: [Laboratory]
      operationId: recordLabResult
      summary: Enter synthetic laboratory result (planned)
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewLabResult' }
      responses:
        '201':
          description: Result recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Planned authentication mechanism; not implemented yet.
  parameters:
    patientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    orderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Health:
      type: object
      required: [service, status]
      properties:
        service: { type: string, example: hms-community }
        status: { type: string, enum: [UP] }
    NewPatient:
      type: object
      required: [displayName, dateOfBirth]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 150 }
        dateOfBirth: { type: string, format: date }
        contactPhone: { type: string, maxLength: 32 }
    Patient:
      allOf:
        - $ref: '#/components/schemas/NewPatient'
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Clinician:
      type: object
      required: [id, displayName, department]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        department: { type: string }
    NewAppointment:
      type: object
      required: [patientId, clinicianId, startsAt, endsAt]
      properties:
        patientId: { type: string, format: uuid }
        clinicianId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    Appointment:
      allOf:
        - $ref: '#/components/schemas/NewAppointment'
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [SCHEDULED, CANCELLED, COMPLETED] }
    NewEncounter:
      type: object
      required: [appointmentId]
      properties:
        appointmentId: { type: string, format: uuid }
    Encounter:
      allOf:
        - $ref: '#/components/schemas/NewEncounter'
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [OPEN, CLOSED] }
    NewLabOrder:
      type: object
      required: [encounterId, testCode]
      properties:
        encounterId: { type: string, format: uuid }
        testCode: { type: string, maxLength: 50 }
    LabOrder:
      allOf:
        - $ref: '#/components/schemas/NewLabOrder'
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [ORDERED, PROCESSING, COMPLETED, CANCELLED] }
    NewLabResult:
      type: object
      required: [resultValue, unit]
      properties:
        resultValue: { type: string, maxLength: 128 }
        unit: { type: string, maxLength: 32 }
        note: { type: string, maxLength: 500 }
    LabResult:
      allOf:
        - $ref: '#/components/schemas/NewLabResult'
        - type: object
          required: [id, recordedAt]
          properties:
            id: { type: string, format: uuid }
            recordedAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [title, status, code]
      properties:
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code: { type: string }
        detail: { type: string }
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication is missing or invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: User is not permitted to perform this action
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Requested state conflicts with existing data
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
