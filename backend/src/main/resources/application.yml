spring:
  application:
    name: hms-community

  autoconfigure:
    exclude:
      # Spring Boot'un rastgele parolalı bellek içi varsayılan kullanıcısı kapatılır:
      # kullanılmaz ve üretilen parolayı başlangıçta loga yazar.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      # Veri kaynağı yalnızca HMS_DB_URL verildiğinde DatabaseConfiguration tarafından kurulur;
      # adres yoksa uygulama veritabanısız ve fail-closed (HTTP 503) çalışır.
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  datasource:
    # Bağlantı bilgileri yalnızca ortam değişkenlerinden okunur; depoda parola tutulmaz.
    url: ${HMS_DB_URL:}
    username: ${HMS_DB_USER:}
    password: ${HMS_DB_PASSWORD:}
  flyway:
    # Migration'lar (Data iş akışına ait V1..V3) başlangıçta uygulanır. Üretimde çalışma zamanı kullanıcısı
    # yalnızca hms_app rolünün üyesi olabilir; şemayı kuran kullanıcı ayrı verilebilir.
    user: ${HMS_DB_MIGRATION_USER:${HMS_DB_USER:}}
    password: ${HMS_DB_MIGRATION_PASSWORD:${HMS_DB_PASSWORD:}}
    # Varsayılan yalnızca şema migration'larıdır. Yerel demoda sentetik US-09 dizini için
    # "classpath:db/migration,classpath:db/seed" verilir (compose.yaml).
    locations: ${HMS_FLYWAY_LOCATIONS:classpath:db/migration}
  web:
    # Doğrulama mesajları sunucu yerel ayarından bağımsız ve öngörülebilir olsun diye sabit İngilizce;
    # kullanıcıya gösterilecek metinler ön yüzde hata kodlarından üretilir.
    locale: en
    locale-resolver: fixed
server:
  port: 8080
  shutdown: graceful
hms:
  security:
    # Erişim tokenının mutlak geçerlilik süresi (ISO-8601). Varsayılan: bir vardiya (8 saat).
    access-token-ttl: PT8H
  bootstrap:
    # İlk yönetici yalnızca bu iki değer birlikte verilirse ve sistemde hiç yönetici yoksa oluşturulur
    # (AdministratorBootstrap). Değerler yalnızca ortamdan okunur; depoda varsayılan parola yoktur.
    admin:
      username: ${HMS_BOOTSTRAP_ADMIN_USERNAME:}
      password: ${HMS_BOOTSTRAP_ADMIN_PASSWORD:}
      first-name: ${HMS_BOOTSTRAP_ADMIN_FIRST_NAME:Sistem}
      last-name: ${HMS_BOOTSTRAP_ADMIN_LAST_NAME:Yöneticisi}
