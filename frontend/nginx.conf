server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Docker'ın gömülü DNS'i. Backend adı açılışta değil her istekte çözülür; backend henüz
    # hazır değilse Nginx kapanmaz ("host not found in upstream"), istek 502 alır.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # Değişkenli proxy_pass, ilk istekteki URI'yi olduğu gibi iletir.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
